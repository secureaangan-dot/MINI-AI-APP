name: MINI AI Android APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the APK (e.g. MiniCalculator)'
        required: true
        default: 'MiniCalculator'
      app_title:
        description: 'Display title for Release'
        required: false
        default: 'MINI Generated App'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release

      - name: Prepare Artifact
        id: prep
        run: |
          APP_NAME="${{ inputs.app_name || 'MiniCalculator' }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '_')
          cp build/app/outputs/flutter-apk/app-release.apk "${SAFE_NAME}.apk"
          echo "apk_path=${SAFE_NAME}.apk" >> $GITHUB_OUTPUT
          echo "safe_name=${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.safe_name }}-apk
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 7

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ github.run_number }}-${{ steps.prep.outputs.safe_name }}"
          TITLE="${{ inputs.app_title || inputs.app_name || 'MINI Generated App' }} (Build #${{ github.run_number }})"
          gh release create "$TAG_NAME" "${{ steps.prep.outputs.apk_path }}" \
            --title "$TITLE" \
            --notes "Generated automatically by MINI AI Cloud Builder for Mukesh Patil." || echo "Release creation skipped, artifact is preserved."
